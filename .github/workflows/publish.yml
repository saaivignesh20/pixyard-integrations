# Publishes n8n-nodes-piku to npm with a provenance statement. Based on the n8n node starter's publish.yml
# (@n8n/node-cli >= 0.23.0): inside GitHub Actions, `npm run release` runs lint and build, then `npm publish` with
# NPM_CONFIG_PROVENANCE=true. n8n requires community nodes to be published this way from May 1 2026.
#
# One-time setup on npmjs.com (recommended, no secret): the package's settings -> Trusted Publishers -> GitHub Actions,
# owner saaivignesh20, repository piku-integrations, workflow publish.yml. Fallback: a granular npm token with
# publish rights as the repository secret NPM_TOKEN.
#
# Run it with `gh workflow run publish.yml -R saaivignesh20/piku-integrations`, or push a tag n8n-v0.1.0.
# The version published is the one in n8n-nodes-piku/package.json.

name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'n8n-v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: n8n-nodes-piku

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Release
        # Option A (OIDC): leave NPM_TOKEN unset and npm uses the OIDC exchange.
        # Option B (token): set NPM_TOKEN in repo secrets; it is written to .npmrc here before publishing.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
